<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <defs>
    <radialGradient id="ember" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#1e1218" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070d17" />
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="720" height="420" fill="url(#ember)" />

  <!-- Top WebAR HUD Bar -->
  <rect x="42" y="26" width="636" height="42" rx="10" fill="#091320" fill-opacity="0.78" stroke="#fb923c" stroke-opacity="0.35" />
  <circle cx="64" cy="47" r="5" fill="#fb923c" />
  <text x="80" y="52" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="800">Phoenix WebAR · Marker Tracking &amp; 3D GLTF Preview</text>
  <rect x="528" y="36" width="134" height="22" rx="11" fill="#10b981" fill-opacity="0.18" stroke="#34d399" />
  <text x="542" y="51" fill="#5eead4" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800">MARKER LOCKED</text>

  <!-- 3D Perspective Marker Floor Plane -->
  <polygon points="220,295 500,295 575,355 145,355" fill="#0f1e2e" fill-opacity="0.6" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="6 4" />
  <polygon points="255,307 465,307 510,342 210,342" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.5" />

  <!-- AR Camera Reticle Brackets -->
  <g stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M168 96h28M168 96v28" />
    <path d="M552 96h-28M552 96v28" />
    <path d="M168 312h28M168 312v-28" />
    <path d="M552 312h-28M552 312v-28" />
  </g>

  <!-- Stylized Geometric 3D Phoenix -->
  <g>
    <circle cx="360" cy="186" r="78" fill="#fb923c" opacity="0.12" />
    <!-- Outer Wings -->
    <path d="M360 212 C 295 142, 225 140, 178 122 C 204 176, 262 215, 344 226 Z" fill="url(#wing)" />
    <path d="M360 212 C 425 142, 495 140, 542 122 C 516 176, 458 215, 376 226 Z" fill="url(#wing)" />
    <!-- Inner Flame Feathers -->
    <path d="M360 226 C 312 178, 258 176, 218 168 C 246 206, 294 228, 350 234 Z" fill="#fde047" opacity="0.88" />
    <path d="M360 226 C 408 178, 462 176, 502 168 C 474 206, 426 228, 370 234 Z" fill="#fde047" opacity="0.88" />
    <!-- Body & Crest -->
    <path d="M360 112 L 372 195 L 360 296 L 348 195 Z" fill="#fef08a" />
    <circle cx="360" cy="108" r="9" fill="#fde047" />
    <!-- Tail Plumes -->
    <path d="M360 265 C 335 288, 304 302, 276 314" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />
    <path d="M360 265 C 385 288, 416 302, 444 314" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Right Floating HUD Controls -->
  <rect x="572" y="114" width="106" height="176" rx="12" fill="#091320" fill-opacity="0.82" stroke="#283d54" />
  <text x="588" y="138" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">CONTROLS</text>
  <rect x="586" y="150" width="78" height="28" rx="6" fill="#132538" stroke="#fb923c" stroke-width="1" />
  <text x="596" y="168" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">↻ Orbit 3D</text>
  <rect x="586" y="188" width="78" height="28" rx="6" fill="#132538" stroke="#2dd4bf" stroke-width="1" />
  <text x="596" y="206" fill="#5eead4" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">⊕ Scale 1.2×</text>
  <rect x="586" y="226" width="78" height="28" rx="6" fill="#132538" stroke="#38bdf8" stroke-width="1" />
  <text x="596" y="244" fill="#bae6fd" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">🔊 Audio</text>
</svg>
