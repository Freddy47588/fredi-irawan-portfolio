<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07162c" />
      <stop offset="55%" stop-color="#0e2f4f" />
      <stop offset="100%" stop-color="#134e5e" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="720" height="420" fill="url(#sky)" />

  <!-- Solar Halo in Sky Canvas -->
  <circle cx="575" cy="108" r="110" fill="url(#sunGlow)" />
  <circle cx="575" cy="108" r="32" fill="#fef08a" />

  <!-- Top Observatory Bar -->
  <rect x="40" y="28" width="640" height="44" rx="12" fill="#07111f" fill-opacity="0.62" stroke="#38bdf8" stroke-opacity="0.3" />
