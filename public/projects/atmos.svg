  <rect x="64" y="206" width="96" height="26" rx="13" fill="#0f2942" stroke="#2dd4bf" stroke-opacity="0.45" />
  <text x="78" y="223" fill="#5eead4" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AQI 34 GOOD</text>

