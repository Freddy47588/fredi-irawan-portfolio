  <rect x="148" y="40" width="54" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
  <circle cx="160" cy="50" r="3.5" fill="#34d399" />
  <text x="169" y="54" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" font-weight="800">LIVE</text>

  <text x="230" y="54" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Malang, East Java · Open-Meteo Telemetry</text>
  <rect x="598" y="38" width="66" height="24" rx="12" fill="#0f243c" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="614" y="54" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">EN | ID</text>

