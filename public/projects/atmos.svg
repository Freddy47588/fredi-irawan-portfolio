  <text x="64" y="184" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800">28°C</text>
  <text x="228" y="156" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Scattered Clouds</text>
  <text x="228" y="178" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Feels like 30° · High 31° · Low 22°</text>

