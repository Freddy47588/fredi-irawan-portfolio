  <rect x="268" y="206" width="126" height="26" rx="13" fill="#0f2942" stroke="#38bdf8" stroke-opacity="0.35" />
  <text x="282" y="223" fill="#bae6fd" font-family="ui-monospace, monospace" font-size="11" font-weight="700">💨 14 km/h ESE</text>

