  <rect x="436" y="88" width="244" height="162" rx="14" fill="#07111f" fill-opacity="0.58" stroke="#38bdf8" stroke-opacity="0.28" />
  <text x="458" y="118" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.2">SOLAR &amp; AIR QUALITY</text>
  <!-- Sun Arc -->
  <path d="M466 196 A 92 72 0 0 1 650 196" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M466 196 A 92 72 0 0 1 595 142" fill="none" stroke="#fbbf24" stroke-width="3" />
  <circle cx="595" cy="142" r="7" fill="#fde047" />
  <line x1="458" y1="196" x2="658" y2="196" stroke="#1e3a5f" stroke-width="1.5" />
  <text x="464" y="216" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">05:24 WIB</text>
  <text x="532" y="216" fill="#fde047" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">UV 6.4</text>
  <text x="598" y="216" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">17:38 WIB</text>

  <!-- Bottom 24-Hour Cubic-Bezier Forecast Card -->
  <rect x="40" y="264" width="640" height="98" rx="14" fill="#07111f" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.28" />
  <text x="64" y="290" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">24-Hour Scrubbable Forecast Curve</text>
  <text x="546" y="290" fill="#5eead4" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TEMP · RAIN · WIND · UV</text>

  <path d="M64 340 C 140 336, 195 298, 275 302 C 355 306, 410 334, 495 316 C 560 302, 605 308, 656 322 L 656 352 L 64 352 Z" fill="url(#curveFill)" />
  <path d="M64 340 C 140 336, 195 298, 275 302 C 355 306, 410 334, 495 316 C 560 302, 605 308, 656 322" fill="none" stroke="#5eead4" stroke-width="3" />
  <g fill="#5eead4">
    <circle cx="155" cy="322" r="4.5" />
    <circle cx="275" cy="302" r="5.5" stroke="#07111f" stroke-width="2" />
    <circle cx="395" cy="321" r="4.5" />
    <circle cx="515" cy="312" r="4.5" />
    <circle cx="620" cy="315" r="4.5" />
