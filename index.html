<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="Fredi Irawan is an Informatics student and software developer creating reliable applications across web, mobile, GIS, data analytics, and computer vision."
    />
    <meta property="og:title" content="Fredi Irawan | Software Developer Portfolio" />
    <meta
      property="og:description"
      content="An Informatics student and software developer creating reliable web, mobile, GIS, data analytics, and computer vision applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://freddy47588.github.io/fredi-irawan-portfolio/" />
    <meta
      property="og:image"
      content="https://freddy47588.github.io/fredi-irawan-portfolio/social-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fredi Irawan — Software Developer Portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fredi Irawan | Software Developer Portfolio" />
    <meta
      name="twitter:description"
      content="An Informatics student and software developer creating reliable web, mobile, GIS, data analytics, and computer vision applications."
    />
    <meta
      name="twitter:image"
      content="https://freddy47588.github.io/fredi-irawan-portfolio/social-preview.png"

    <link rel="canonical" href="https://freddy47588.github.io/fredi-irawan-portfolio/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme');
        const isDark = savedTheme !== 'light';
        document.documentElement.classList.toggle('dark', isDark);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', isDark ? '#07111f' : '#f7f8fa');
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
    <title>Fredi Irawan | Software Developer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
